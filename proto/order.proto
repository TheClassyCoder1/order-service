syntax = "proto3";

package order;

// Source-of-truth contract for the Order domain.
// payment-service vendors a COPY of this file to build its gRPC client.
// Keep the two in sync — drift breaks cross-repo calls.

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;     // new: order created but awaiting inventory check
  CREATED = 2;
  PAID = 3;
  CANCELLED = 4;
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message GetOrderRequest {
  string order_ref = 1;
}

message GetOrderResponse {
  string order_ref = 1;
  int64 amount_cents = 2;      // minor units (cents)
  string currency = 3;
  OrderStatus status = 4;
  int64 created_at_ms = 5;     // epoch milliseconds
  int64 customer_id = 6;
}
