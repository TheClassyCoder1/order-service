syntax = "proto3";

package order;

// Source-of-truth contract for the Order domain.
// payment-service vendors a COPY of this file to build its gRPC client.
// Keep the two in sync — drift breaks cross-repo calls.

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  CREATED = 1;
  PAID = 2;
  CANCELLED = 3;
}

service OrderService {
  // Renamed from GetOrder for verb consistency with FetchInvoice/FetchRefund.
  rpc FetchOrder(GetOrderRequest) returns (GetOrderResponse);
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  string id = 1;
  double amount = 2;         // major currency units (e.g. 49.99), was int64 cents
  OrderStatus status = 3;    // enum, was free-form string
  string currency = 5;       // moved off tag 3 (now used by status)
}
